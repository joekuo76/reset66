<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>RESET 66</title><style>
:root{--bg:#090d16;--card:#141b2a;--soft:#1d2638;--txt:#f6f7fb;--muted:#9ba7bc;--accent:#8b5cf6;--good:#35d07f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090d16,#101626);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.pill{background:var(--soft);padding:8px 12px;border-radius:999px;font-size:13px}.hero{padding:26px 4px 18px}.hero h1{font-size:34px;margin:8px 0}.muted{color:var(--muted)}.bar{height:12px;background:#222c40;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#c084fc);width:1.5%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:rgba(20,27,42,.94);border:1px solid #263149;border-radius:18px;padding:16px}.stat b{font-size:24px;display:block;margin-top:5px}.section{margin-top:22px}.section h2{font-size:18px}.quest{display:flex;align-items:center;gap:12px;margin:10px 0;background:var(--card);border:1px solid #263149;padding:14px;border-radius:16px}.quest.done{opacity:.65}.check{width:30px;height:30px;border-radius:10px;border:2px solid #56627a;background:transparent;color:white;font-weight:bold}.done .check{background:var(--good);border-color:var(--good)}.qtext{flex:1}.qtext b{display:block}.xp{color:#bca7ff;font-weight:700;font-size:13px}.boss{border:1px solid #7c5ce5;background:linear-gradient(135deg,#1a1831,#191f34)}button.reset{width:100%;margin-top:22px;padding:13px;border:0;border-radius:14px;background:#252e40;color:#d8deea}.footer{text-align:center;color:#68758c;font-size:12px;margin-top:28px}
</style></head><body><main class="app"><div class="top"><div class="brand">RESET 66</div><div class="pill" id="dayPill">DAY 1 / 66</div></div><section class="hero"><div class="muted">YOUR NEXT VERSION</div><h1>今天也前進一點。</h1><div class="bar"><div class="fill" id="progress"></div></div><div class="muted" id="progressText">66 天旅程剛開始</div></section><div class="grid"><div class="stat"><span class="muted">LEVEL</span><b id="level">1</b></div><div class="stat"><span class="muted">TOTAL XP</span><b id="totalXp">0</b></div><div class="stat"><span class="muted">🔥 STREAK</span><b id="streak">0 天</b></div><div class="stat"><span class="muted">TODAY</span><b id="todayXp">0 / 100</b></div></div><section class="section"><h2>⚔️ 今日 Quest</h2><div id="quests"></div></section><section class="section"><div class="card boss"><b>👑 Week 1 Boss — 重新啟動</b><p class="muted">本週累積 400 XP，並完成至少 5 天。第一版先由你手動追蹤，下一版加入週統計與徽章。</p></div></section><button class="reset" onclick="newDay()">模擬進入下一天</button><div class="footer">資料只儲存在這台裝置的瀏覽器 • RESET 66 MVP</div></main><script>
const base=[['🛠️','職涯技能','弱電 / 光纖 / AutoCAD 30 分鐘',30],['🏃','身體','走路或運動 30 分鐘',20],['🧹','生活','整理或處理拖延事項 15 分鐘',10],['❤️','家庭','30 分鐘專心陪伴家人',20],['💰','財務 Check','記帳 / 檢查支出 / 無衝動消費',20]];
let s=JSON.parse(localStorage.getItem('reset66')||'{"day":1,"total":0,"streak":0,"done":[]}');function save(){localStorage.setItem('reset66',JSON.stringify(s))}function render(){let q=document.getElementById('quests');q.innerHTML='';let tx=0;base.forEach((x,i)=>{let d=s.done.includes(i);if(d)tx+=x[3];let el=document.createElement('div');el.className='quest '+(d?'done':'');el.innerHTML=`<button class="check">${d?'✓':''}</button><div class="qtext"><b>${x[0]} ${x[1]}</b><span class="muted">${x[2]}</span></div><span class="xp">+${x[3]} XP</span>`;el.onclick=()=>toggle(i);q.appendChild(el)});document.getElementById('todayXp').textContent=tx+' / 100';document.getElementById('totalXp').textContent=s.total+tx;document.getElementById('level').textContent=Math.floor((s.total+tx)/500)+1;document.getElementById('streak').textContent=s.streak+' 天';document.getElementById('dayPill').textContent=`DAY ${s.day} / 66`;document.getElementById('progress').style.width=(s.day/66*100)+'%';document.getElementById('progressText').textContent=`已完成 ${Math.max(0,s.day-1)} 天 · ${Math.round(s.day/66*100)}%`}
function toggle(i){s.done.includes(i)?s.done=s.done.filter(v=>v!==i):s.done.push(i);save();render()}function newDay(){let earned=base.reduce((a,x,i)=>a+(s.done.includes(i)?x[3]:0),0);s.total+=earned;if(s.done.length>=3)s.streak++;else s.streak=0;s.day=Math.min(66,s.day+1);s.done=[];save();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
